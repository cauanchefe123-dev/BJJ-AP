  <body class="notranslate">
    <div id="root"></div>
    <script>
      if ('serviceWorker' in navigator) {
        let refreshing = false;

        // When a new Service Worker activates and takes control, reload cleanly once
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (!refreshing) {
            refreshing = true;
            console.log('[BJJCRON] Nova versão do aplicativo ativada. Atualizando tela...');
            window.location.reload();
          }
        });

        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then((reg) => {
            console.log('SW BJJCRON registrado com sucesso:', reg.scope);

            // Check for updates on load
            reg.update().catch(() => {});

            // Check for updates every 60 seconds
            setInterval(() => {
              reg.update().catch(() => {});
            }, 60000);

            // Check for updates when user brings app back to focus / unminimizes
            document.addEventListener('visibilitychange', () => {
              if (document.visibilityState === 'visible') {
                reg.update().catch(() => {});
              }
            });
            window.addEventListener('focus', () => {
              reg.update().catch(() => {});
            });

            // Handle when a new worker is discovered
            reg.addEventListener('updatefound', () => {
              const newWorker = reg.installing;
              if (newWorker) {
                newWorker.addEventListener('statechange', () => {
                  if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                    console.log('[BJJCRON] Nova versão pronta para instalação.');
                    newWorker.postMessage({ type: 'SKIP_WAITING' });
                  }
                });
              }
            });
          }).catch((err) => {
            console.log('Erro ao registrar SW:', err);
          });
        });
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
